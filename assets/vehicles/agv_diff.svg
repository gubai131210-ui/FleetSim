<?xml version="1.0" encoding="UTF-8"?>
<!-- FleetSim AGV  Agent-editable SVG vehicle model (ADR-004) -->
<!-- viewBox: 100 x 60 logical units; +X = forward direction; center H (50, 30) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 60">
  <rect x="10" y="15" width="75" height="30" rx="6" ry="6"
        fill="#4682DC" stroke="#1a3a6e" stroke-width="2"/>
  <!-- cabin -->
  <rect x="55" y="18" width="22" height="24" rx="3" ry="3"
        fill="#6CA6FF" stroke="#1a3a6e" stroke-width="1.5"/>
  <!-- forward indicator -->
  <polygon points="90,30 78,22 78,38" fill="#FFD700" stroke="#B8860B" stroke-width="1"/>
  <!-- wheels (diff-drive AGV) -->
  <rect x="18" y="8" width="14" height="8" rx="2" fill="#333"/>
  <rect x="18" y="44" width="14" height="8" rx="2" fill="#333"/>
  <rect x="42" y="8" width="14" height="8" rx="2" fill="#333"/>
  <rect x="42" y="44" width="14" height="8" rx="2" fill="#333"/>
  <!-- ID label area (optional text for Phase 3 multi-AGV) -->
  <text x="50" y="33" text-anchor="middle" font-size="10" fill="white" font-family="sans-serif">AGV</text>
</svg>
